# WingRate — full stack: PostgreSQL + Next.js app + rate updater + (optional) Caddy HTTPS
# All values come from .env (generated by install.sh).

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app_db
      NODE_ENV: production
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Fetches the Wing Bank rate every UPDATE_INTERVAL seconds and triggers Telegram alerts
  updater:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-60}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "updater: fetching Wing Bank rate every $${UPDATE_INTERVAL}s"
        while true; do
          curl -fsS -H "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/cron/update-rate > /dev/null \
            || echo "updater: fetch failed (will retry)"
          sleep "$${UPDATE_INTERVAL}"
        done
    depends_on:
      app:
        condition: service_healthy

  # Automatic HTTPS (Let's Encrypt). Enabled when COMPOSE_PROFILES=https in .env
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
