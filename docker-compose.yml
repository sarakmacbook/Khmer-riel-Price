version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - db

  cron:
    image: curlimages/curl:latest
    restart: always
    command: 
      - sh
      - -c
      - |
        while true; do
          curl -s http://app:3000/api/cron/update-rate > /dev/null
          sleep 300
        done
    depends_on:
      - app

volumes:
  postgres_data:
