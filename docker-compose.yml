version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CRON_SECRET: ${CRON_SECRET:-}
      # Optional: only these chats may use the Telegram /database menu.
      # TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      # Where the database picked in Telegram is remembered (survives restarts).
      DB_CONFIG_FILE: /app/.data/wingrate-db.json
      # Optional: protect POST/DELETE /api/database with this secret.
      # ADMIN_SECRET: ${ADMIN_SECRET:-}
    volumes:
      - app_data:/app/.data
    depends_on:
      - db

  cron:
    image: curlimages/curl:latest
    restart: always
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      RATE_UPDATE_INTERVAL_SECONDS: ${RATE_UPDATE_INTERVAL_SECONDS:-10}
    command:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/update-rate > /dev/null || true
          sleep "$$RATE_UPDATE_INTERVAL_SECONDS"
        done
    depends_on:
      - app

volumes:
  postgres_data:
  app_data:
