<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="wingrate-title wingrate-description">
  <title id="wingrate-title">WingRate</title>
  <desc id="wingrate-description">A rising white exchange-rate chart forming a W on an indigo background.</desc>
  <defs>
    <linearGradient id="wingrate-surface" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.48" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="wingrate-glow" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed square keeps the mark ready for browser tabs and PWA masks. -->
  <rect width="512" height="512" fill="url(#wingrate-surface)"/>
  <rect width="512" height="512" fill="url(#wingrate-glow)"/>

  <!-- A rising rate line that also forms a bold W. -->
  <path
    d="M104 302 L180 378 L256 228 L332 354 L403 145"
    fill="none"
    stroke="#ffffff"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Forward arrow: the rate is moving up and to the right. -->
  <path d="M403 104 L435 167 L371 150 Z" fill="#22d3ee"/>

  <!-- Starting point gives the mark a clear plotted-data feel at small sizes. -->
  <circle cx="104" cy="302" r="20" fill="#22d3ee"/>
</svg>
